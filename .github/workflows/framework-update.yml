# Moves meitou.lock.json to new Rivalry Core beta releases: builds and tests, opens a PR into beta and merges it when CI is green
# (GutenStructure docs/framework-update.md). A failing PR stays open as the regression report. The beta channel tests every Rivalry Core
# beta snapshot here within 6 hours (GutenStructure docs/versioning.md).
name: Framework update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/framework-update.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
    with:
      tools-ref: 29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
      channel: beta
    secrets:
      app-id: ${{ secrets.MEITOU_BOT_APP_ID }}
      app-key: ${{ secrets.MEITOU_BOT_KEY }}
