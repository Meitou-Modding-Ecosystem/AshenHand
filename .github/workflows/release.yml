# Releases The Ashen Hand: a tag ashen-hand-v<version> builds the mod, checks the version against its meitou.json, and publishes
# AshenHand-<version>.zip (with its SHA-256) holding the folder to drop into Kenshi/mods/. Packaging: GutenStructure package-meitou-mod.yml (pinned).
name: Release

on:
  push:
    tags: ["ashen-hand-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@2136f4ee8e7c9461d635a3960d10c68d06dde893

  release:
    needs: release-gate
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@2136f4ee8e7c9461d635a3960d10c68d06dde893
    with:
      mod-folder: AshenHand
      slug: ashen-hand
      channel: release
      test-project: .
      empty-data-mod: false
